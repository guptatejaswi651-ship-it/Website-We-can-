```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Management</title>

    <style>

        /* ---------- BASIC STYLING ---------- */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* ---------- FORM ---------- */

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        /* ---------- PASSWORD ---------- */

        .password-box {
            display: flex;
            gap: 5px;
        }

        .password-box input {
            flex: 1;
        }

        .password-box button {
            padding: 0 12px;
            border: 1px solid #ccc;
            background: #eee;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ---------- CHECKBOX ---------- */

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .checkbox input {
            width: auto;
        }

        /* ---------- LOGIN OPTIONS ---------- */

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        a {
            color: #222;
            font-weight: bold;
            cursor: pointer;
        }

        /* ---------- MAIN BUTTON ---------- */

        .main-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .main-btn:hover {
            background: #444;
        }

        /* ---------- BOTTOM TEXT ---------- */

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        /* ---------- HIDE SIGNUP ---------- */

        #signupPage {
            display: none;
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 480px) {

            .auth-box {
                padding: 25px 20px;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- ================= LOGIN PAGE ================= -->

        <div class="auth-box" id="loginPage">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to manage your events
            </p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('loginPassword')"
                    >
                        Show
                    </button>

                </div>


                <div class="login-options">

                    <label class="checkbox">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember Me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="main-btn"
                >
                    Login
                </button>

            </form>


            <p class="bottom-text">

                Don't have an account?

                <a onclick="showSignup()">
                    Sign Up
                </a>

            </p>

        </div>



        <!-- ================= SIGNUP PAGE ================= -->

        <div class="auth-box" id="signupPage">

            <h1>Create Account</h1>

            <p class="subtitle">
                Join us and start managing your events
            </p>


            <form id="signupForm">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('password')"
                    >
                        Show
                    </button>

                </div>


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirmPassword')"
                    >
                        Show
                    </button>

                </div>


                <label class="checkbox">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I agree to the Terms & Conditions

                </label>


                <button
                    type="submit"
                    class="main-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="bottom-text">

                Already have an account?

                <a onclick="showLogin()">
                    Login
                </a>

            </p>

        </div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // Show / Hide Password

        function togglePassword(id) {

            const passwordInput =
                document.getElementById(id);

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

            } else {

                passwordInput.type = "password";

            }
        }



        // Show Signup Page

        function showSignup() {

            document.getElementById("loginPage").style.display = "none";

            document.getElementById("signupPage").style.display = "block";

        }



        // Show Login Page

        function showLogin() {

            document.getElementById("signupPage").style.display = "none";

            document.getElementById("loginPage").style.display = "block";

        }



        // Signup Validation

        document
            .getElementById("signupForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    alert("Passwords do not match!");

                    return;
                }


                alert("Account created successfully!");

            });



        // Login

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Login successful!");

            });

    </script>

</body>

</html>
```
